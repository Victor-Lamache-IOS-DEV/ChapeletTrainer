name: iOS Build & Sign

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Patch scheme archive config to Release
        run: |
          SCHEME="ChapeletTrainer.xcodeproj/xcshareddata/xcschemes/ChapeletTrainer.xcscheme"
          python3 - "$SCHEME" << 'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(r'(<ArchiveAction[^>]*?)buildConfiguration = "[^"]*"([^>]*>)', r'\1buildConfiguration = "Release"\2', s)
          open(p, 'w').write(s)
          print("patched")
          PY

      - name: Run unit tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/^[[:space:]]*([^(]+)[[:space:]]*\(.*/\1/' | xargs)
          echo "Testing on simulator: $SIM_NAME"
          xcodebuild test -scheme ChapeletTrainer -destination "platform=iOS Simulator,name=$SIM_NAME" CODE_SIGNING_ALLOWED=NO clean test

      - name: Decode certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPSTORE_BUILD_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > build_certificate.p12
          security create-keychain -p "${{ secrets.APPSTORE_KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.APPSTORE_KEYCHAIN_PASSWORD }}" build.keychain
          security import build_certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.APPSTORE_KEYCHAIN_PASSWORD }}" build.keychain

      - name: Decode provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build & Archive
        run: |
          xcodebuild -scheme ChapeletTrainer -configuration Release \
            -archivePath build/ChapeletTrainer.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="ChapeletTrainer AppStore" \
            DEVELOPMENT_TEAM=A63WD37CXZ \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ChapeletTrainer.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChapeletTrainer.ipa
          path: build/export/*.ipa

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app -f build/export/*.ipa -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
